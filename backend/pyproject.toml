[project]
name = "heliosense-backend"
version = "0.1.0"
description = "API FastAPI para gestão residencial de energia solar (HelioSense)"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "pymysql>=1.1.1",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
